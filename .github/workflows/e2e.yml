name: E2E

# DESACTIVADO el 25/08/2026: estos tests pegan contra la base REAL
# compartida con producción (ver docs/E2E-tests.md) y mandan pedidos de
# verdad a cocina -- con el print-bridge corriendo en el bar, cada push
# imprimía una comanda física real. Encontramos el problema porque el
# bar reportó que la impresora estaba tirando comandas de la nada.
# No reactivar sin resolver antes docs/Pendientes-y-bloqueos.md#2 (base
# de datos aparte para los tests -- ya existe comandacafe-dev, pausada,
# ver docs/Arquitectura.md).
on:
  workflow_dispatch: {}

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Correr tests E2E
        run: npm run test:e2e

      - name: Subir reporte (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
